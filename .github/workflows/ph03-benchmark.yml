name: PH-03 Query Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - experimental
    paths:
      - 'benchmarks/**'
      - 'src/context/context-index-service.ts'
      - 'src/context/source-resolver.ts'
      - 'src/state/context-repository.ts'
      - 'src/state/migrations/002-context-index.ts'
      - 'package.json'
      - '.github/workflows/ph03-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run benchmark:ph03
      - uses: actions/upload-artifact@v4
        with:
          name: ph03-benchmark-${{ runner.os }}
          path: |
            evidence/generated/ph03-query-benchmark.json
            evidence/generated/ph03-candidate-sql-benchmark.json
            evidence/generated/ph03-candidate-admission-benchmark.json
            evidence/generated/ph03-admission-recall-stress.json
            evidence/generated/ph03-multiscope-admission-stress.json
            evidence/generated/ph03-source-hash-benchmark.json
            evidence/generated/ph03-verification-budget-benchmark.json
            evidence/generated/ph03-source-reuse-stress.json
            evidence/generated/ph03-index-lifecycle-stress.json
          if-no-files-found: error
