name: PH-03 Query Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - experimental
    paths:
      - 'benchmarks/**'
      - 'src/context/context-index-service.ts'
      - 'package.json'
      - '.github/workflows/ph03-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run benchmark:ph03
      - uses: actions/upload-artifact@v4
        with:
          name: ph03-query-benchmark
          path: evidence/generated/ph03-query-benchmark.json
          if-no-files-found: error
